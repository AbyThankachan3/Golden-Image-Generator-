# CIS 4.2 — Journald Hardening
[Journal]
# Compress logs to save disk space
Compress=yes

# Persist logs to disk (survive reboots)
Storage=persistent

# Forward to syslog if present
ForwardToSyslog=yes

# Maximum disk usage for journal
SystemMaxUse=500M

# Maximum size per individual journal file
SystemMaxFileSize=50M
