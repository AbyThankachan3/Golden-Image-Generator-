name: Build Golden Image ISO

on:
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: 'Ubuntu version'
        required: true
        type: choice
        default: '24.04.4'
        options:
          - '22.04.5'
          - '24.04.4'
          - 'custom'

      custom_iso_url:
        description: 'Custom ISO URL (only when version = custom)'
        required: false
        type: string
        default: ''

      output_filename:
        description: 'Output ISO filename (leave blank for auto-generated name)'
        required: false
        type: string
        default: ''

      enable_hardening:
        description: 'Enable CIS Level 1 hardening'
        required: true
        type: boolean
        default: true

      package_removal_list:
        description: 'Packages to remove (one per line, comma-separated, or leave empty for auto-detect)'
        required: false
        type: string
        default: ''

      extra_packages_keep:
        description: 'Extra packages to protect from removal (one per line or comma-separated)'
        required: false
        type: string
        default: ''

      storage_destination:
        description: 'Where to save the built ISO'
        required: true
        type: choice
        default: 'artifact'
        options:
          - 'artifact'
          - 'azure-blob'
          - 's3'

      azure_container:
        description: 'Azure Blob container name (for azure-blob storage)'
        required: false
        type: string
        default: 'golden-images'

      s3_bucket:
        description: 'S3/MinIO bucket name (for s3 storage)'
        required: false
        type: string
        default: 'golden-images'

      s3_endpoint:
        description: 'S3/MinIO endpoint URL (for s3 storage, e.g. https://minio.local:9000)'
        required: false
        type: string
        default: ''

jobs:
  build:
    name: Build Golden Image
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ── Step 1: Validate Inputs ───────────────────────────────
      - name: Validate inputs
        run: |
          echo "::group::Input Validation"

          # Version validation
          if [ "${{ inputs.ubuntu_version }}" = "custom" ] && [ -z "${{ inputs.custom_iso_url }}" ]; then
            echo "::error::When version is 'custom', you must provide a Custom ISO URL"
            exit 1
          fi

          # GRUB password required when hardening enabled
          if [ "${{ inputs.enable_hardening }}" = "true" ]; then
            if [ -z "${{ secrets.GRUB_PASSWORD }}" ]; then
              echo "::error::GRUB_PASSWORD secret is required when CIS hardening is enabled."
              echo "::error::Ask your repo admin to set it under Settings > Secrets and variables > Actions."
              exit 1
            fi
          fi

          # Storage credential validation
          if [ "${{ inputs.storage_destination }}" = "azure-blob" ]; then
            if [ -z "${{ secrets.AZURE_CONNECTION_STRING }}" ]; then
              echo "::error::AZURE_CONNECTION_STRING secret is required for Azure Blob storage."
              exit 1
            fi
          fi

          if [ "${{ inputs.storage_destination }}" = "s3" ]; then
            if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ] || [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
              echo "::error::AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets are required for S3 storage."
              exit 1
            fi
          fi

          echo "All inputs validated successfully"
          echo "::endgroup::"

      # ── Step 2: Checkout ──────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 3: Free Disk Space ───────────────────────────────
      - name: Free disk space
        run: |
          echo "::group::Freeing disk space"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/share/swift /usr/local/.ghcup
          sudo apt-get clean 2>/dev/null || true
          echo "After cleanup:"
          df -h /
          echo "::endgroup::"

      # ── Step 4: Cache Base ISO ────────────────────────────────
      - name: Cache base ISO
        uses: actions/cache@v4
        with:
          path: ./cache
          key: iso-${{ inputs.ubuntu_version }}-${{ hashFiles(inputs.custom_iso_url || 'default') }}
          restore-keys: |
            iso-${{ inputs.ubuntu_version }}-

      # ── Step 5: Prepare Package Lists ─────────────────────────
      - name: Prepare package lists
        run: .github/scripts/prepare-packages.sh
        env:
          PACKAGE_REMOVAL_LIST: ${{ inputs.package_removal_list }}
          EXTRA_PACKAGES_KEEP: ${{ inputs.extra_packages_keep }}
          OUTPUT_DIR: ./output

      # ── Step 6: Generate GRUB Hash ────────────────────────────
      - name: Generate GRUB password hash
        if: inputs.enable_hardening == true
        run: .github/scripts/generate-grub-hash.sh
        env:
          GRUB_PASSWORD: ${{ secrets.GRUB_PASSWORD }}

      # ── Step 7: Display CIS Values ───────────────────────────
      - name: Display CIS hardening values
        if: inputs.enable_hardening == true
        run: .github/scripts/display-cis-values.sh

      # ── Step 8: Build Golden Image ────────────────────────────
      - name: Build golden image
        run: |
          ARGS="--auto-approve --output-dir ./output --cache-dir ./cache"

          # Hardening
          if [ "${{ inputs.enable_hardening }}" = "true" ]; then
            ARGS="${ARGS} --harden-all"
          fi

          # Package list
          if [ -f "./output/user-packages.txt" ]; then
            ARGS="${ARGS} --packages-file ./output/user-packages.txt"
          fi

          # Version or custom URL
          if [ "${{ inputs.ubuntu_version }}" = "custom" ]; then
            ARGS="${ARGS} --url ${{ inputs.custom_iso_url }}"
          else
            ARGS="${ARGS} ${{ inputs.ubuntu_version }}"
          fi

          echo "Running: ./golden-image-builder.sh ${ARGS}"
          eval ./golden-image-builder.sh ${ARGS}

      # ── Step 9: Rename Output ─────────────────────────────────
      - name: Rename output ISO
        if: inputs.output_filename != ''
        run: |
          DEFAULT_NAME=$(ls ./output/golden-ubuntu-minimal-*.iso 2>/dev/null | head -1)
          if [ -n "$DEFAULT_NAME" ] && [ "$DEFAULT_NAME" != "./output/${{ inputs.output_filename }}" ]; then
            mv "$DEFAULT_NAME" "./output/${{ inputs.output_filename }}"
            echo "Renamed: $(basename $DEFAULT_NAME) → ${{ inputs.output_filename }}"
          fi

      # ── Step 10a: Upload as Artifact ──────────────────────────
      - name: Upload ISO as artifact
        if: inputs.storage_destination == 'artifact'
        uses: actions/upload-artifact@v4
        with:
          name: golden-image-iso
          path: ./output/*.iso
          retention-days: 30

      - name: Upload validation script as artifact
        if: inputs.storage_destination == 'artifact'
        uses: actions/upload-artifact@v4
        with:
          name: validation-script
          path: ./output/validate-golden-image.sh
          retention-days: 30
          if-no-files-found: ignore

      # ── Step 10b: Upload to Azure Blob ────────────────────────
      - name: Upload to Azure Blob Storage
        if: inputs.storage_destination == 'azure-blob'
        run: .github/scripts/upload-storage.sh azure
        env:
          AZURE_CONNECTION_STRING: ${{ secrets.AZURE_CONNECTION_STRING }}
          AZURE_CONTAINER: ${{ inputs.azure_container }}
          ISO_DIR: ./output

      # ── Step 10c: Upload to S3/MinIO ──────────────────────────
      - name: Upload to S3/MinIO
        if: inputs.storage_destination == 's3'
        run: .github/scripts/upload-storage.sh s3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_ENDPOINT: ${{ inputs.s3_endpoint }}
          ISO_DIR: ./output

      # ── Step 11: Build Summary ────────────────────────────────
      - name: Build summary
        if: always()
        run: |
          echo "## Golden Image Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          ISO_FILE=$(ls ./output/*.iso 2>/dev/null | head -1)
          if [ -n "$ISO_FILE" ]; then
            SIZE=$(du -sh "$ISO_FILE" | awk '{print $1}')
            FILENAME=$(basename "$ISO_FILE")

            echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Ubuntu Version | \`${{ inputs.ubuntu_version }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| CIS Level 1 Hardening | \`${{ inputs.enable_hardening }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| ISO Size | ${SIZE} |" >> $GITHUB_STEP_SUMMARY
            echo "| ISO Filename | \`${FILENAME}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Storage | \`${{ inputs.storage_destination }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
            echo "1. Download the ISO from the artifacts section above" >> $GITHUB_STEP_SUMMARY
            echo "2. Boot a VM from the ISO and install Ubuntu" >> $GITHUB_STEP_SUMMARY
            echo "3. Run the validation script: \`sudo bash validate-golden-image.sh\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "No ISO was produced. Check the build logs above for errors." >> $GITHUB_STEP_SUMMARY
          fi
