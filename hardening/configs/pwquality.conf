# CIS 5.3.1 — Password Quality Requirements
# Enforced by libpam-pwquality (installed in Layer 1)

# Minimum password length
minlen = 14

# Require at least 1 digit
dcredit = -1

# Require at least 1 uppercase letter
ucredit = -1

# Require at least 1 special character
ocredit = -1

# Require at least 1 lowercase letter
lcredit = -1

# Maximum consecutive identical characters
maxrepeat = 3

# Maximum sequential characters (abc, 123)
maxsequence = 3

# Reject passwords containing the username
usercheck = 1

# Enforce check against dictionary words
dictcheck = 1

# Minimum number of character classes required (digit, upper, lower, special)
minclass = 4
