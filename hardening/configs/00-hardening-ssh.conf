# Golden Image SSH Hardening
# Addresses all Lynis SSH-7408 findings + CIS Benchmark

# Disable weak MACs
MACs umac-128-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,umac-128@openssh.com,hmac-sha2-256,hmac-sha2-512

# Disable weak ciphers
Ciphers aes128-ctr,aes192-ctr,aes256-ctr,aes128-gcm@openssh.com,aes256-gcm@openssh.com

# Disable weak key exchange algorithms
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512

# Core security settings
PermitRootLogin no
PasswordAuthentication no
PermitEmptyPasswords no
X11Forwarding no
LoginGraceTime 60

# Lynis SSH-7408 hardening
MaxAuthTries 3
MaxSessions 2
AllowTcpForwarding no
AllowAgentForwarding no
Compression no
TCPKeepAlive no
ClientAliveCountMax 2
ClientAliveInterval 300
LogLevel VERBOSE

# CIS 5.2.15 — Display login banner before authentication
Banner /etc/issue.net
