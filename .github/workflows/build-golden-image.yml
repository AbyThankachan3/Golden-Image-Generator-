name: Build Golden Image ISO

# ── Azure Storage Configuration (hardcoded) ──────────────
# Storage Account: <REPLACE_WITH_STORAGE_ACCOUNT>
# Subscription ID: <REPLACE_WITH_SUBSCRIPTION_ID>
# Container:       admin-golden-image-iso

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: 'Ubuntu ISO download URL (e.g. https://releases.ubuntu.com/24.04.4/ubuntu-24.04.4-live-server-amd64.iso)'
        required: true
        type: string

      mode:
        description: 'Run mode'
        required: true
        type: choice
        default: 'analyze-only'
        options:
          - 'analyze-only'
          - 'analyze-and-build'
          - 'build-only'

      output_filename:
        description: 'Output ISO filename (leave blank for auto-generated)'
        required: false
        type: string
        default: ''

      enable_hardening:
        description: 'Enable CIS Level 1 hardening'
        required: true
        type: boolean
        default: true

      install_tools:
        description: 'Install extra tools (Docker, kubectl, helm, etc.) — uses config from extra-tools/ folder'
        required: true
        type: boolean
        default: false

      extra_tools_file:
        description: 'Extra tools config filename (from extra-tools/ folder)'
        required: false
        type: string
        default: 'extra-tools.yml'

# ── Hardcoded Azure config ───────────────────────────────
env:
  AZURE_STORAGE_ACCOUNT: "starmgalosimgdevccwus01"
  AZURE_SUBSCRIPTION_ID: "d7ed655f-2b86-4049-b485-35c2d70afc9d"
  AZURE_CONTAINER: "admin-golden-image-iso"

jobs:
  # ────────────────────────────────────────────────────────────
  #  JOB 1a: DISPLAY CIS VALUES (instant — runs in parallel)
  # ────────────────────────────────────────────────────────────
  review-cis:
    name: "Review: CIS Hardening Values"
    if: inputs.enable_hardening == true
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate GRUB secret
        run: |
          if [ -z "${{ secrets.GRUB_PASSWORD }}" ]; then
            echo "::error::GRUB_PASSWORD secret is required when CIS hardening is enabled."
            echo "::error::Set it under: Settings → Secrets and variables → Actions → Repository secrets"
            exit 1
          fi

      - name: Display CIS hardening values
        shell: bash {0}
        run: |
          dump_section() {
            local title="$1" section="$2"
            echo "### ${title}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            awk "/^${section}:/{f=1;next} f && /^[a-z_]+:/{exit} f && /^  /" cis-config.yml \
              | grep -v '^$' \
              | head -30 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          }

          echo "## CIS Level 1 Hardening Values" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Source: \`cis-config.yml\` -- edit this file in the repo to customize." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f cis-config.yml ]; then
            dump_section "SSH Hardening" "ssh"
            dump_section "Credential Policy" "pw_policy"
            dump_section "Session" "session"
            dump_section "Kernel Hardening" "kernel"
            dump_section "Network Hardening" "network"
            dump_section "Core Dump Protection" "core_dump"
            dump_section "Services Masked (disabled)" "services_masked"
            dump_section "Kernel Modules Disabled" "modules_disabled"
            dump_section "Audit Rules" "audit"

            echo "### GRUB Bootloader" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "  GRUB protection: ENABLED (PBKDF2)" >> $GITHUB_STEP_SUMMARY
            echo "  Boot without credentials: YES (--unrestricted)" >> $GITHUB_STEP_SUMMARY
            echo "  Edit GRUB requires credentials: YES (username: admin)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            dump_section "Security Packages Installed" "packages_installed"
          else
            echo "cis-config.yml not found -- using static defaults from hardening/configs/" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "> **To customize:** Edit \`cis-config.yml\` in the repo, commit, and re-run." >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────
  #  JOB 1c: DISPLAY EXTRA TOOLS (instant — no ISO needed)
  # ────────────────────────────────────────────────────────────
  review-tools:
    name: "Review: Extra Tools"
    if: inputs.install_tools == true
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display extra tools summary
        shell: bash {0}
        run: |
          TOOLS_FILE="extra-tools/${{ inputs.extra_tools_file }}"

          echo "## Extra Tools to Install" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Source: \`${TOOLS_FILE}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -f "$TOOLS_FILE" ]; then
            echo "**File not found:** \`${TOOLS_FILE}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Available files in \`extra-tools/\`:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            ls extra-tools/*.yml 2>/dev/null || echo "  (none)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "### APT Packages" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          awk '/^apt_packages:/{f=1;next} f && /^[a-z_]+:/{exit} f && /^  - /' "$TOOLS_FILE" | sed 's/^  - //' >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Binary Tools (downloaded)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Destination |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------------|" >> $GITHUB_STEP_SUMMARY
          awk '/^binary_tools:/{f=1;next} f && /^[a-z_]+:/{exit} f' "$TOOLS_FILE" | while IFS= read -r line; do
            if echo "$line" | grep -q "name:"; then
              NAME=$(echo "$line" | sed 's/.*name:[[:space:]]*//' | sed 's/"//g')
            fi
            if echo "$line" | grep -q "dest:"; then
              DEST=$(echo "$line" | sed 's/.*dest:[[:space:]]*//' | sed 's/"//g')
              echo "| $NAME | \`$DEST\` |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "" >> $GITHUB_STEP_SUMMARY

          DEB_NAMES=$(awk '/^deb_packages:/{f=1;next} f && /^[a-z_]+:/{exit} f && /name:/' "$TOOLS_FILE" | sed 's/.*name:[[:space:]]*//' | sed 's/"//g')
          if [ -n "$DEB_NAMES" ]; then
            echo "### Deb Packages" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$DEB_NAMES" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "### Services Enabled" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          awk '/^services_enabled:/{f=1;next} f && /^[a-z_]+:/{exit} f && /^  - /' "$TOOLS_FILE" | sed 's/^  - //' >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "> **To customize:** Edit \`${TOOLS_FILE}\` in the repo, or create a new file in \`extra-tools/\`." >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────
  #  JOB 1b: ANALYZE PACKAGES
  # ────────────────────────────────────────────────────────────
  analyze:
    name: "Review: Package Analysis"
    if: inputs.mode != 'build-only'
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.iso_url }}" ]; then
            echo "::error::ISO URL is required"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check disk space
        run: df -h / | tail -1

      - name: Run package analysis
        run: |
          mkdir -p $HOME/GoldenImages/cache
          ./golden-image-builder.sh \
            --analyze-only \
            --output-dir ./output \
            --cache-dir $HOME/GoldenImages/cache \
            --url "${{ inputs.iso_url }}"

      - name: Display packages for review
        run: |
          echo "## Package Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f ./output/safe-packages.txt ]; then
            SAFE=$(wc -l < ./output/safe-packages.txt | tr -d ' ')
            CRITICAL=$(wc -l < ./output/critical-packages.txt 2>/dev/null | tr -d ' ')
            RISKY=$(wc -l < ./output/risky-packages.txt 2>/dev/null | tr -d ' ')

            echo "| Category | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Critical (keep) | ${CRITICAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Safe (will remove)** | **${SAFE}** |" >> $GITHUB_STEP_SUMMARY
            echo "| Risky (skip) | ${RISKY} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "### Packages that WILL BE REMOVED:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat ./output/safe-packages.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "<details><summary>Click to see CRITICAL packages (will be kept)</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat ./output/critical-packages.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
            echo "Analysis produced no results. Check the logs above." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

          VERSION=$(basename "${{ inputs.iso_url }}" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          VERSION="${VERSION:-unknown}"

          if [ "${{ inputs.mode }}" = "analyze-only" ]; then
            echo "## Analyze Only Mode" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Build was **not started**. To build:" >> $GITHUB_STEP_SUMMARY
            echo "1. Review the packages and CIS values above" >> $GITHUB_STEP_SUMMARY
            echo "2. (Optional) Edit and upload as \`approved-packages-${VERSION}.txt\` to \`approved-lists/\`" >> $GITHUB_STEP_SUMMARY
            echo "3. Re-run with mode = **build-only** or **analyze-and-build**" >> $GITHUB_STEP_SUMMARY
          else
            echo "> Build job will start automatically using these packages." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Add version suffix to report files
        run: |
          VERSION=$(basename "${{ inputs.iso_url }}" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          VERSION="${VERSION:-unknown}"

          for f in safe-packages critical-packages risky-packages package-report; do
            if [ -f "./output/${f}.txt" ]; then
              cp "./output/${f}.txt" "./output/${f}-${VERSION}.txt"
            fi
          done

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: analysis-results
          path: |
            ./output/safe-packages.txt
            ./output/safe-packages-*.txt
            ./output/critical-packages.txt
            ./output/risky-packages.txt
            ./output/package-report.txt
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  #  JOB 2: BUILD — ISO uploaded to Azure Blob Storage
  # ────────────────────────────────────────────────────────────
  build:
    name: "Build ISO"
    needs: [review-cis, review-tools, analyze]
    if: |
      always() &&
      inputs.mode != 'analyze-only' &&
      (needs.analyze.result == 'success' || needs.analyze.result == 'skipped') &&
      (needs.review-cis.result == 'success' || needs.review-cis.result == 'skipped') &&
      (needs.review-tools.result == 'success' || needs.review-tools.result == 'skipped')
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check disk space
        run: df -h / | tail -1

      - name: Validate Azure credentials
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "::error::AZURE_CREDENTIALS secret is required for uploading the ISO."
            echo "::error::Set it under: Settings → Secrets and variables → Actions → Repository secrets"
            echo "::error::Format: JSON with clientId, clientSecret, subscriptionId, tenantId"
            exit 1
          fi

      - name: Download analysis results
        if: inputs.mode == 'analyze-and-build'
        uses: actions/download-artifact@v4
        with:
          name: analysis-results
          path: ./output

      - name: Determine package list
        run: |
          mkdir -p ./output
          VERSION=$(basename "${{ inputs.iso_url }}" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          VERSION="${VERSION:-unknown}"
          MODE="${{ inputs.mode }}"

          FOUND=""

          if [ "$MODE" = "analyze-and-build" ]; then
            if [ -f "./output/safe-packages-${VERSION}.txt" ]; then
              echo "Using safe-packages-${VERSION}.txt from analyze job (this run)"
              cp "./output/safe-packages-${VERSION}.txt" ./output/approved-packages.txt
              FOUND=1
            elif [ -f "./output/safe-packages.txt" ]; then
              echo "Using safe-packages.txt from analyze job (this run)"
              cp "./output/safe-packages.txt" ./output/approved-packages.txt
              FOUND=1
            fi
          fi

          if [ -z "$FOUND" ] && [ "$MODE" = "build-only" ]; then
            if [ -f "./approved-lists/approved-packages-${VERSION}.txt" ]; then
              echo "Using approved-lists/approved-packages-${VERSION}.txt from repo"
              cp "./approved-lists/approved-packages-${VERSION}.txt" ./output/approved-packages.txt
              FOUND=1
            fi
          fi

          if [ -z "$FOUND" ]; then
            echo "::error::No package list found for version ${VERSION}."
            if [ "$MODE" = "build-only" ]; then
              echo "::error::Push approved-packages-${VERSION}.txt to approved-lists/ folder in repo."
              echo "::error::Or run analyze-only first."
            else
              echo "::error::Analyze job did not produce a package list."
            fi
            exit 1
          fi
          echo "Packages to remove: $(wc -l < ./output/approved-packages.txt | tr -d ' ')"

      - name: Generate GRUB hash
        if: inputs.enable_hardening == true
        run: .github/scripts/generate-grub-hash.sh
        env:
          GRUB_PASSWORD: ${{ secrets.GRUB_PASSWORD }}

      - name: Build golden image
        run: |
          mkdir -p $HOME/GoldenImages/cache
          ARGS="--auto-approve --output-dir ./output --cache-dir $HOME/GoldenImages/cache"
          ARGS="${ARGS} --packages-file ./output/approved-packages.txt"

          if [ "${{ inputs.enable_hardening }}" = "true" ]; then
            ARGS="${ARGS} --harden-all"
          fi

          if [ "${{ inputs.install_tools }}" = "true" ]; then
            ARGS="${ARGS} --install-tools"
            export EXTRA_TOOLS_FILE="${{ inputs.extra_tools_file }}"
          fi

          ARGS="${ARGS} --url ${{ inputs.iso_url }}"

          echo "Running: ./golden-image-builder.sh ${ARGS}"
          eval ./golden-image-builder.sh ${ARGS}

      - name: Rename output ISO
        if: inputs.output_filename != ''
        run: |
          CUSTOM_NAME="${{ inputs.output_filename }}"
          if [[ "$CUSTOM_NAME" != *.iso ]]; then
            CUSTOM_NAME="${CUSTOM_NAME}.iso"
          fi
          DEFAULT_NAME=$(ls ./output/golden-ubuntu-minimal-*.iso 2>/dev/null | head -1)
          if [ -n "$DEFAULT_NAME" ] && [ "$DEFAULT_NAME" != "./output/${CUSTOM_NAME}" ]; then
            mv "$DEFAULT_NAME" "./output/${CUSTOM_NAME}"
          fi

      - name: Verify ISO integrity
        run: |
          ISO_FILE=$(ls ./output/*.iso 2>/dev/null | head -1)
          if [ -z "$ISO_FILE" ]; then
            ISO_FILE=$(file ./output/* 2>/dev/null | grep "ISO 9660" | cut -d: -f1 | head -1)
          fi

          if [ -z "$ISO_FILE" ]; then
            echo "::error::No ISO file found in ./output/"
            ls -la ./output/ 2>/dev/null
            exit 1
          fi

          echo "## ISO Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FILE_INFO=$(file "$ISO_FILE")
          echo "File: $(basename "$ISO_FILE")" >> $GITHUB_STEP_SUMMARY
          echo "Size: $(du -h "$ISO_FILE" | awk '{print $1}')" >> $GITHUB_STEP_SUMMARY

          if echo "$FILE_INFO" | grep -q "ISO 9660"; then
            echo "Format: Valid ISO 9660 filesystem" >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::File is NOT a valid ISO: $FILE_INFO"
            exit 1
          fi

          if echo "$FILE_INFO" | grep -q "bootable"; then
            echo "Boot: Bootable (MBR/BIOS)" >> $GITHUB_STEP_SUMMARY
          fi

          if echo "$FILE_INFO" | grep -qi "DOS/MBR"; then
            echo "EFI: UEFI+BIOS hybrid boot supported" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ISO verification passed" >> $GITHUB_STEP_SUMMARY

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '${{ secrets.AZURE_CREDENTIALS }}'

      - name: Set Azure Subscription
        run: az account set --subscription "${{ env.AZURE_SUBSCRIPTION_ID }}"

      - name: Upload ISO to Azure Blob Storage
        run: |
          ISO_FILE=$(ls ./output/*.iso 2>/dev/null | head -1)

          if [ -z "$ISO_FILE" ]; then
            echo "::error::No ISO file to upload"
            exit 1
          fi

          ISO_NAME=$(basename "$ISO_FILE")
          ISO_SIZE=$(du -sh "$ISO_FILE" | awk '{print $1}')
          VERSION=$(basename "${{ inputs.iso_url }}" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "Uploading ${ISO_NAME} (${ISO_SIZE}) to Azure..."
          echo "  Account:   ${{ env.AZURE_STORAGE_ACCOUNT }}"
          echo "  Container: ${{ env.AZURE_CONTAINER }}"

          # Upload ISO with metadata
          az storage blob upload \
            --auth-mode login \
            --account-name "${{ env.AZURE_STORAGE_ACCOUNT }}" \
            --container-name "${{ env.AZURE_CONTAINER }}" \
            --name "${ISO_NAME}" \
            --file "${ISO_FILE}" \
            --overwrite \
            --metadata \
              ubuntuVersion="${VERSION}" \
              buildDate="${BUILD_DATE}" \
              cisHardening="${{ inputs.enable_hardening }}" \
              extraTools="${{ inputs.install_tools }}" \
              sourceRepo="${{ github.repository }}" \
              sourceCommit="${{ github.sha }}" \
              workflowRun="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "ISO uploaded: ${ISO_NAME}"

          # Get blob URL
          ISO_URL=$(az storage blob url \
            --auth-mode login \
            --account-name "${{ env.AZURE_STORAGE_ACCOUNT }}" \
            --container-name "${{ env.AZURE_CONTAINER }}" \
            --name "${ISO_NAME}" \
            --output tsv 2>/dev/null || echo "")

          echo "AZURE_ISO_URL=${ISO_URL}" >> $GITHUB_ENV
          echo "AZURE_ISO_NAME=${ISO_NAME}" >> $GITHUB_ENV

      - name: Build summary
        if: always()
        run: |
          echo "## Golden Image Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          ISO_FILE=$(ls ./output/*.iso 2>/dev/null | head -1)

          if [ -n "$ISO_FILE" ]; then
            SIZE=$(du -sh "$ISO_FILE" | awk '{print $1}')
            FILENAME=$(basename "$ISO_FILE")

            echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ISO URL | \`$(basename "${{ inputs.iso_url }}")\` |" >> $GITHUB_STEP_SUMMARY
            echo "| CIS Hardening | \`${{ inputs.enable_hardening }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Extra Tools | \`${{ inputs.install_tools }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| ISO Size | ${SIZE} |" >> $GITHUB_STEP_SUMMARY
            echo "| Filename | \`${FILENAME}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Azure Account | \`${{ env.AZURE_STORAGE_ACCOUNT }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Azure Container | \`${{ env.AZURE_CONTAINER }}\` |" >> $GITHUB_STEP_SUMMARY

            if [ -n "${AZURE_ISO_URL:-}" ]; then
              echo "| Azure Blob URL | [Download](${AZURE_ISO_URL}) |" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
            echo "1. Download ISO from Azure: \`${{ env.AZURE_STORAGE_ACCOUNT }}\` / \`${{ env.AZURE_CONTAINER }}\`" >> $GITHUB_STEP_SUMMARY
            echo "2. Boot a VM from the ISO and install Ubuntu" >> $GITHUB_STEP_SUMMARY
            echo "3. Run validation: \`sudo bash validate-golden-image.sh\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "No ISO produced. Check build logs for errors." >> $GITHUB_STEP_SUMMARY
          fi
