# CIS Benchmark — Disable unused filesystems and protocols
# modprobe blacklist — placed at /etc/modprobe.d/CIS.conf

# Unused filesystems (CIS 1.1.1.x)
install cramfs /bin/true
blacklist cramfs
install freevxfs /bin/true
blacklist freevxfs
install jffs2 /bin/true
blacklist jffs2
install hfs /bin/true
blacklist hfs
install hfsplus /bin/true
blacklist hfsplus
install udf /bin/true
blacklist udf

# Unused network protocols (Lynis NETW-3200)
install dccp /bin/true
blacklist dccp
install sctp /bin/true
blacklist sctp
install rds /bin/true
blacklist rds
install tipc /bin/true
blacklist tipc

# USB storage (CIS 1.1.10)
install usb-storage /bin/true
blacklist usb-storage

# Firewire (attack surface reduction)
install firewire-ohci /bin/true
blacklist firewire-ohci
install firewire-sbp2 /bin/true
blacklist firewire-sbp2
