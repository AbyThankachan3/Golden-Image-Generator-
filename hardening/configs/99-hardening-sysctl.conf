# Golden Image Kernel Hardening (sysctl)
# CIS Benchmark + Lynis KRNL-6000 compliant
# Loaded automatically at boot by systemd-sysctl.service

# ── Disable ICMP redirects ──────────────────────────────
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# ── Disable IPv6 redirects ──────────────────────────────
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# ── Disable source routing ──────────────────────────────
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# ── TCP hardening ────────────────────────────────────────
net.ipv4.tcp_syncookies = 1

# ── Log martian packets ──────────────────────────────────
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# ── Ignore ICMP broadcasts ──────────────────────────────
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# ── Reverse path filtering ──────────────────────────────
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# ── Restrict dmesg ───────────────────────────────────────
kernel.dmesg_restrict = 1

# ── ASLR ─────────────────────────────────────────────────
kernel.randomize_va_space = 2

# ── Restrict kernel pointer access ──────────────────────
kernel.kptr_restrict = 2

# ── Protect hardlinks and symlinks ──────────────────────
fs.protected_hardlinks = 1
fs.protected_symlinks = 1

# ══════════════════════════════════════════════════════════
# Lynis KRNL-6000 DIFFERENT findings (new additions)
# ══════════════════════════════════════════════════════════

# Disable line discipline autoload (CVE prevention)
dev.tty.ldisc_autoload = 0

# Protect FIFOs in world-writable sticky directories
fs.protected_fifos = 2

# Disable core dumps via suid_dumpable
fs.suid_dumpable = 0

# Restrict perf_event access (Spectre/Meltdown mitigation)
kernel.perf_event_paranoid = 3

# Disable magic SysRq key (prevents physical attack vectors)
kernel.sysrq = 0

# Disable unprivileged BPF (prevent BPF-based attacks)
kernel.unprivileged_bpf_disabled = 1

# Harden BPF JIT compiler
net.core.bpf_jit_harden = 2

# NOTE: kernel.modules_disabled = 1 is intentionally NOT set here.
# It prevents loading ANY kernel module after boot, which breaks
# k8s networking (overlay, br_netfilter) and many other things.
# Uncomment only for locked-down appliance use cases:
# kernel.modules_disabled = 1
