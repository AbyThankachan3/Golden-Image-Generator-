name: Build Golden Image ISO

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: 'Ubuntu ISO download URL (e.g. https://releases.ubuntu.com/24.04.4/ubuntu-24.04.4-live-server-amd64.iso)'
        required: true
        type: string

      mode:
        description: 'Run mode'
        required: true
        type: choice
        default: 'analyze-only'
        options:
          - 'analyze-only'
          - 'analyze-and-build'
          - 'build-only'

      output_path:
        description: 'Local path to save ISO (e.g. /Users/aby/GoldenImages/)'
        required: false
        type: string
        default: ''

      output_filename:
        description: 'Output ISO filename (leave blank for auto-generated)'
        required: false
        type: string
        default: ''

      enable_hardening:
        description: 'Enable CIS Level 1 hardening'
        required: true
        type: boolean
        default: true

      storage_destination:
        description: 'Where to upload the built ISO (local = on this machine)'
        required: true
        type: choice
        default: 'local'
        options:
          - 'local'
          - 'azure-blob'
          - 's3'

      azure_container:
        description: 'Azure Blob container name (for azure-blob)'
        required: false
        type: string
        default: 'golden-images'

      s3_bucket:
        description: 'S3/MinIO bucket name (for s3)'
        required: false
        type: string
        default: 'golden-images'

      s3_endpoint:
        description: 'S3/MinIO endpoint URL (for s3, e.g. https://minio.local:9000)'
        required: false
        type: string
        default: ''

jobs:
  # ────────────────────────────────────────────────────────────
  #  JOB 1a: DISPLAY CIS VALUES (instant — runs in parallel)
  # ────────────────────────────────────────────────────────────
  review-cis:
    name: "Review: CIS Hardening Values"
    if: inputs.enable_hardening == true
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate GRUB secret
        run: |
          if [ -z "${{ secrets.GRUB_PASSWORD }}" ]; then
            echo "::error::GRUB_PASSWORD secret is required when CIS hardening is enabled."
            echo "::error::Set it under: Settings → Secrets and variables → Actions → Repository secrets"
            exit 1
          fi

      - name: Display CIS hardening values
        shell: bash {0}
        run: |
          # Helper: extract YAML section content between two top-level keys
          dump_section() {
            local title="$1" section="$2"
            echo "### ${title}" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Extract lines between "section:" and next top-level key (non-indented, non-comment)
            sed -n "/^${section}:/,/^[a-z]/{/^${section}:/d;/^[a-z]/d;p}" cis-config.yml \
              | grep -v '^$' \
              | grep -v '^#' \
              | head -30 >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          }

          echo "## CIS Level 1 Hardening Values" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Source: \`cis-config.yml\` -- edit this file in the repo to customize." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f cis-config.yml ]; then
            dump_section "SSH Hardening" "ssh"
            dump_section "Credential Policy" "pw_policy"
            dump_section "Session" "session"
            dump_section "Kernel Hardening" "kernel"
            dump_section "Network Hardening" "network"
            dump_section "Core Dump Protection" "core_dump"
            dump_section "Services Masked (disabled)" "services_masked"
            dump_section "Kernel Modules Disabled" "modules_disabled"
            dump_section "Audit Rules" "audit"

            echo "### GRUB Bootloader" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "  GRUB protection: ENABLED (PBKDF2)" >> $GITHUB_STEP_SUMMARY
            echo "  Boot without credentials: YES (--unrestricted)" >> $GITHUB_STEP_SUMMARY
            echo "  Edit GRUB requires credentials: YES (username: admin)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            dump_section "Security Packages Installed" "packages_installed"
          else
            echo "cis-config.yml not found -- using static defaults from hardening/configs/" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "> **To customize:** Edit \`cis-config.yml\` in the repo, commit, and re-run." >> $GITHUB_STEP_SUMMARY
          echo "> **To upload custom files:** Use the repo's **Add file -> Upload files** button." >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────
  #  JOB 1b: ANALYZE PACKAGES
  # ────────────────────────────────────────────────────────────
  analyze:
    name: "Review: Package Analysis"
    if: inputs.mode != 'build-only'
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Validate inputs
        run: |
          if [ -z "${{ inputs.iso_url }}" ]; then
            echo "::error::ISO URL is required"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check disk space
        run: df -h / | tail -1

      - name: Run package analysis
        run: |
          mkdir -p $HOME/GoldenImages/cache
          ./golden-image-builder.sh \
            --analyze-only \
            --output-dir ./output \
            --cache-dir $HOME/GoldenImages/cache \
            --url "${{ inputs.iso_url }}"

      - name: Display packages for review
        run: |
          echo "## 📦 Package Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f ./output/safe-packages.txt ]; then
            SAFE=$(wc -l < ./output/safe-packages.txt | tr -d ' ')
            CRITICAL=$(wc -l < ./output/critical-packages.txt 2>/dev/null | tr -d ' ')
            RISKY=$(wc -l < ./output/risky-packages.txt 2>/dev/null | tr -d ' ')

            echo "| Category | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Critical (keep) | ${CRITICAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Safe (will remove)** | **${SAFE}** |" >> $GITHUB_STEP_SUMMARY
            echo "| Risky (skip) | ${RISKY} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "### Packages that WILL BE REMOVED:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat ./output/safe-packages.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            echo "<details><summary>Click to see CRITICAL packages (will be kept)</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat ./output/critical-packages.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          else
            echo " Analysis produced no results. Check the logs above." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

          VERSION=$(basename "${{ inputs.iso_url }}" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          VERSION="${VERSION:-unknown}"

          if [ "${{ inputs.mode }}" = "analyze-only" ]; then
            echo "## Analyze Only Mode" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Build was **not started**. To build the ISO:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. Review the packages and CIS values above" >> $GITHUB_STEP_SUMMARY
            echo "2. (Optional) Copy the safe list, edit it, upload as \`approved-packages-${VERSION}.txt\` to the repo" >> $GITHUB_STEP_SUMMARY
            echo "3. Re-run the workflow with mode = **build-only** or **analyze-and-build**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Reports saved locally at: \`~/GoldenImages/safe-packages-${VERSION}.txt\` etc." >> $GITHUB_STEP_SUMMARY
          else
            echo "> Build job will start automatically using these packages." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Add version suffix to report files
        run: |
          # Extract version from ISO URL
          VERSION=$(basename "${{ inputs.iso_url }}" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          VERSION="${VERSION:-unknown}"

          for f in safe-packages critical-packages risky-packages package-report approved-packages; do
            if [ -f "./output/${f}.txt" ]; then
              cp "./output/${f}.txt" "./output/${f}-${VERSION}.txt"
            fi
          done

          # Save to local output path if set
          DEST="${{ inputs.output_path }}"
          if [ -z "$DEST" ]; then
            DEST="$HOME/GoldenImages"
          fi
          mkdir -p "$DEST"

          for f in ./output/*-${VERSION}.txt; do
            [ -f "$f" ] && cp "$f" "$DEST/"
          done

          echo "Reports saved with version suffix: ${VERSION}"
          echo "Location: ${DEST}/"
          ls -la "$DEST/"*-${VERSION}.txt 2>/dev/null || true

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: analysis-results
          path: |
            ./output/safe-packages.txt
            ./output/critical-packages.txt
            ./output/risky-packages.txt
            ./output/package-report.txt
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  #  JOB 2: BUILD (only runs in analyze-and-build mode)
  # ────────────────────────────────────────────────────────────
  build:
    name: "Build ISO"
    needs: [review-cis, analyze]
    if: |
      always() &&
      inputs.mode != 'analyze-only' &&
      (needs.analyze.result == 'success' || needs.analyze.result == 'skipped') &&
      (needs.review-cis.result == 'success' || needs.review-cis.result == 'skipped')
    runs-on: self-hosted
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check disk space
        run: df -h / | tail -1

      - name: Download analysis results
        if: inputs.mode == 'analyze-and-build'
        uses: actions/download-artifact@v4
        with:
          name: analysis-results
          path: ./output

      - name: Determine package list
        run: |
          mkdir -p ./output
          VERSION=$(basename "${{ inputs.iso_url }}" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          VERSION="${VERSION:-unknown}"
          LOCAL_DIR="${{ inputs.output_path }}"
          LOCAL_DIR="${LOCAL_DIR:-$HOME/GoldenImages}"

          # Search order:
          # 1. Versioned approved file in local dir (user edited after analyze)
          # 2. Versioned safe file in local dir (from previous analyze run)
          # 3. Versioned file in repo root (user uploaded)
          # 4. Plain name in repo root
          # 5. Safe packages from current analysis job
          FOUND=""
          if [ -f "${LOCAL_DIR}/approved-packages-${VERSION}.txt" ]; then
            echo "Using ${LOCAL_DIR}/approved-packages-${VERSION}.txt"
            cp "${LOCAL_DIR}/approved-packages-${VERSION}.txt" ./output/approved-packages.txt
            FOUND=1
          elif [ -f "${LOCAL_DIR}/safe-packages-${VERSION}.txt" ]; then
            echo "Using ${LOCAL_DIR}/safe-packages-${VERSION}.txt (from previous analysis)"
            cp "${LOCAL_DIR}/safe-packages-${VERSION}.txt" ./output/approved-packages.txt
            FOUND=1
          elif [ -f "./approved-packages-${VERSION}.txt" ]; then
            echo "Using approved-packages-${VERSION}.txt from repo"
            cp "./approved-packages-${VERSION}.txt" ./output/approved-packages.txt
            FOUND=1
          elif [ -f ./approved-packages.txt ]; then
            echo "Using approved-packages.txt from repo"
            cp ./approved-packages.txt ./output/approved-packages.txt
            FOUND=1
          elif [ -f ./output/safe-packages.txt ]; then
            echo "Using auto-detected safe packages from analysis"
            cp ./output/safe-packages.txt ./output/approved-packages.txt
            FOUND=1
          fi

          if [ -z "$FOUND" ]; then
            echo "::error::No package list found. Searched:"
            echo "::error::  ${LOCAL_DIR}/approved-packages-${VERSION}.txt"
            echo "::error::  ${LOCAL_DIR}/safe-packages-${VERSION}.txt"
            echo "::error::  ./approved-packages-${VERSION}.txt (repo)"
            echo "::error::  ./approved-packages.txt (repo)"
            echo "::error::Run analyze-only first to generate the package list."
            exit 1
          fi
          echo "Packages to remove: $(wc -l < ./output/approved-packages.txt | tr -d ' ')"

      - name: Generate GRUB hash
        if: inputs.enable_hardening == true
        run: .github/scripts/generate-grub-hash.sh
        env:
          GRUB_PASSWORD: ${{ secrets.GRUB_PASSWORD }}

      - name: Build golden image
        run: |
          mkdir -p $HOME/GoldenImages/cache
          ARGS="--auto-approve --output-dir ./output --cache-dir $HOME/GoldenImages/cache"
          ARGS="${ARGS} --packages-file ./output/approved-packages.txt"

          if [ "${{ inputs.enable_hardening }}" = "true" ]; then
            ARGS="${ARGS} --harden-all"
          fi

          ARGS="${ARGS} --url ${{ inputs.iso_url }}"

          echo "Running: ./golden-image-builder.sh ${ARGS}"
          eval ./golden-image-builder.sh ${ARGS}

      - name: Rename output ISO
        if: inputs.output_filename != ''
        run: |
          CUSTOM_NAME="${{ inputs.output_filename }}"
          # Ensure .iso extension
          if [[ "$CUSTOM_NAME" != *.iso ]]; then
            CUSTOM_NAME="${CUSTOM_NAME}.iso"
          fi
          DEFAULT_NAME=$(ls ./output/golden-ubuntu-minimal-*.iso 2>/dev/null | head -1)
          if [ -n "$DEFAULT_NAME" ] && [ "$DEFAULT_NAME" != "./output/${CUSTOM_NAME}" ]; then
            mv "$DEFAULT_NAME" "./output/${CUSTOM_NAME}"
          fi

      - name: Verify ISO integrity
        run: |
          # Find the ISO file
          ISO_FILE=$(ls ./output/*.iso 2>/dev/null | head -1)
          if [ -z "$ISO_FILE" ]; then
            ISO_FILE=$(file ./output/* 2>/dev/null | grep "ISO 9660" | cut -d: -f1 | head -1)
          fi

          if [ -z "$ISO_FILE" ]; then
            echo "::error::No ISO file found in ./output/"
            ls -la ./output/ 2>/dev/null
            exit 1
          fi

          echo "## ISO Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check file type
          FILE_INFO=$(file "$ISO_FILE")
          echo "File: $(basename "$ISO_FILE")" >> $GITHUB_STEP_SUMMARY
          echo "Size: $(du -h "$ISO_FILE" | awk '{print $1}')" >> $GITHUB_STEP_SUMMARY

          # Verify it's a valid ISO
          if echo "$FILE_INFO" | grep -q "ISO 9660"; then
            echo "Format: Valid ISO 9660 filesystem" >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::File is NOT a valid ISO: $FILE_INFO"
            echo "Format: INVALID - $FILE_INFO" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Check if bootable
          if echo "$FILE_INFO" | grep -q "bootable"; then
            echo "Boot: Bootable (MBR/BIOS)" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::ISO may not be bootable via legacy BIOS"
            echo "Boot: No MBR boot flag detected" >> $GITHUB_STEP_SUMMARY
          fi

          # Check for EFI
          if echo "$FILE_INFO" | grep -qi "DOS/MBR"; then
            echo "EFI: UEFI+BIOS hybrid boot supported" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ISO verification passed" >> $GITHUB_STEP_SUMMARY

      - name: Copy ISO to local path
        if: inputs.storage_destination == 'local'
        run: |
          # Find ISO file (with or without .iso extension)
          ISO_FILE=$(ls ./output/*.iso 2>/dev/null | head -1)
          if [ -z "$ISO_FILE" ]; then
            # Fallback: find by file type
            ISO_FILE=$(file ./output/* 2>/dev/null | grep "ISO 9660" | cut -d: -f1 | head -1)
          fi
          # Add .iso extension if missing
          if [ -n "$ISO_FILE" ] && [[ "$ISO_FILE" != *.iso ]]; then
            mv "$ISO_FILE" "${ISO_FILE}.iso"
            ISO_FILE="${ISO_FILE}.iso"
          fi
          VALIDATE_FILE="./output/validate-golden-image.sh"

          if [ -z "$ISO_FILE" ]; then
            echo "::error::No ISO file found in ./output/"
            echo "::error::Contents of output/:"
            ls -la ./output/ 2>/dev/null || echo "  (empty)"
            exit 1
          fi

          # Determine destination
          DEST="${{ inputs.output_path }}"
          if [ -z "$DEST" ]; then
            DEST="$HOME/GoldenImages"
          fi
          mkdir -p "$DEST"

          # Copy ISO and validation script
          cp "$ISO_FILE" "$DEST/"
          [ -f "$VALIDATE_FILE" ] && cp "$VALIDATE_FILE" "$DEST/"

          ISO_NAME=$(basename "$ISO_FILE")
          echo ""
          echo "══════════════════════════════════════════════════"
          echo "  ISO saved to:"
          echo "  ${DEST}/${ISO_NAME}"
          echo ""
          echo "  Validation script:"
          echo "  ${DEST}/validate-golden-image.sh"
          echo "══════════════════════════════════════════════════"

      - name: Upload to Azure Blob Storage
        if: inputs.storage_destination == 'azure-blob'
        run: .github/scripts/upload-storage.sh azure
        env:
          AZURE_CONNECTION_STRING: ${{ secrets.AZURE_CONNECTION_STRING }}
          AZURE_CONTAINER: ${{ inputs.azure_container }}
          ISO_DIR: ./output

      - name: Upload to S3/MinIO
        if: inputs.storage_destination == 's3'
        run: .github/scripts/upload-storage.sh s3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ inputs.s3_bucket }}
          S3_ENDPOINT: ${{ inputs.s3_endpoint }}
          ISO_DIR: ./output

      - name: Build summary
        if: always()
        run: |
          echo "## Golden Image Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          ISO_FILE=$(ls ./output/*.iso 2>/dev/null | head -1)
          DEST="${{ inputs.output_path }}"
          [ -z "$DEST" ] && DEST="$HOME/GoldenImages"

          if [ -n "$ISO_FILE" ]; then
            SIZE=$(du -sh "$ISO_FILE" | awk '{print $1}')
            FILENAME=$(basename "$ISO_FILE")

            echo "| Setting | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ISO URL | \`$(basename "${{ inputs.iso_url }}")\` |" >> $GITHUB_STEP_SUMMARY
            echo "| CIS Hardening | \`${{ inputs.enable_hardening }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| ISO Size | ${SIZE} |" >> $GITHUB_STEP_SUMMARY
            echo "| Filename | \`${FILENAME}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Storage | \`${{ inputs.storage_destination }}\` |" >> $GITHUB_STEP_SUMMARY

            if [ "${{ inputs.storage_destination }}" = "local" ]; then
              echo "| Saved to | \`${DEST}/${FILENAME}\` |" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
            echo "1. Boot a VM from the ISO: \`${DEST}/${FILENAME}\`" >> $GITHUB_STEP_SUMMARY
            echo "2. Install Ubuntu" >> $GITHUB_STEP_SUMMARY
            echo "3. Run validation: \`sudo bash validate-golden-image.sh\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Build Failed" >> $GITHUB_STEP_SUMMARY
            echo "No ISO produced. Check build logs for errors." >> $GITHUB_STEP_SUMMARY
          fi
